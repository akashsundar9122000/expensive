# Supabase Database Configuration
# Using port 6543 for Transaction Mode (recommended for most apps)
# Added prepareThreshold=0 to avoid prepared statement conflicts in transaction mode
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.qukgojqbtlolatavllht
spring.datasource.password=2iVE5drWiUlKDY88
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=8080

# CORS Configuration (to allow Angular frontend)
app.cors.allowed-origins=http://localhost:4200

# Jackson: serialize LocalDate as "2024-01-15" string (not [2024,1,15] array)
spring.jackson.serialization.write-dates-as-timestamps=false