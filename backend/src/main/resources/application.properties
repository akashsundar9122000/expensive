# Supabase / Postgres Database Configuration
# Render should provide these via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.qukgojqbtlolatavllht}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2iVE5drWiUlKDY88}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration
# Comma-separated origins/patterns (e.g. https://your-frontend.vercel.app,http://localhost:4200)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# Jackson: serialize LocalDate as "2024-01-15" string (not [2024,1,15] array)
spring.jackson.serialization.write-dates-as-timestamps=false