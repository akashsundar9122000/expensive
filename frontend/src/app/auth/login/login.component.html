<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon">
                <i class="ph-bold ph-wallet"></i>
            </div>
            <h2>EXPENSIFY</h2>
            <p>Welcome back! Please enter your details.</p>
        </div>

        <form class="auth-form" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock"></i>
                    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                        [(ngModel)]="password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
                        <i class="ph" [ngClass]="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
                    </button>
                </div>
            </div>

            <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>
            <p class="success-text" *ngIf="infoMessage">{{ infoMessage }}</p>

            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="rememberPassword" [(ngModel)]="rememberPassword">
                    <span class="checkmark"></span>
                    Remember me
                </label>
                <a href="#" class="forgot-password" (click)="toggleForgotPassword($event)">Forgot password?</a>
            </div>

            <div class="forgot-password-form" *ngIf="showForgotPasswordForm">
                <div class="form-group">
                    <label for="forgotEmail">Email</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope"></i>
                        <input type="email" id="forgotEmail" name="forgotEmail" [(ngModel)]="forgotEmail" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="forgotNewPassword">New password</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock"></i>
                        <input type="password" id="forgotNewPassword" name="forgotNewPassword" [(ngModel)]="forgotNewPassword" placeholder="Create a new password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="forgotConfirmPassword">Confirm new password</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock"></i>
                        <input type="password" id="forgotConfirmPassword" name="forgotConfirmPassword" [(ngModel)]="forgotConfirmPassword" placeholder="Re-enter new password" required>
                    </div>
                </div>

                <button type="button" class="google-btn" (click)="submitForgotPassword()">Reset Password</button>
            </div>

            <button type="submit" class="auth-btn" [disabled]="isSubmitting">{{ isSubmitting ? 'Signing in...' : 'Sign In' }}</button>

            <button type="button" class="google-btn" (click)="onGoogleSignIn()" [disabled]="isGoogleSubmitting">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                {{ isGoogleSubmitting ? 'Opening Google...' : 'Sign in with Google' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a routerLink="/signup">Sign up for free</a></p>
        </div>
    </div>

    <div class="auth-visual">
        <div class="visual-content">
            <div class="quote-card">
                <div class="quote-icon"><i class="ph-fill ph-quotes"></i></div>
                <p>"The best way to track your expenses without any hassle. Simple, clean, and effective."</p>
                <div class="quote-author">
                    <div class="author-info" style="margin-left: 0;">
                        <strong>User Community</strong>
                        <span>Secure & Private</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Abstract Background Elements -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
</div>
